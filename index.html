<!DOCTYPE html>
<!--
  📚🎬 나의 작은 서재와 극장 — 홈 화면 런처 (v1, 2026.11.15)
  통합대시보드 런처(v3)와 같은 구조.

  왜 필요한가: Apps Script 웹앱(/exec)은 구글 래퍼 페이지 안에서 열려 apple-touch-icon을 iOS가 읽지 못한다.
  → 이 정적 페이지(GitHub Pages)에서 "홈 화면에 추가"를 하면 아이콘·이름이 그대로 적용된다.
  GAS를 새로 배포해서 /exec 주소가 바뀌면 아래 TARGET 한 줄만 고치면 된다.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>나의 작은 서재와 극장</title>

<!-- ── 홈 화면(PWA) 아이콘·이름 ── -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="서재와 극장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4ede3">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow,noarchive">

<!-- ★ [v3] 이동할 GAS 도메인에 미리 연결 — DNS/TLS 핸드셰이크를 리다이렉트 전에 끝내둔다 -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://script.google.com">

<style>
  :root{ --bg:#f4ede3; --ink:#3b2f25; --mute:#8a7764; --line:#eadfce; --accent:#b5793a; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    text-align:center; -webkit-text-size-adjust:100%;
  }
  .mark{width:96px;height:96px;border-radius:22px;border:1px solid var(--line);
        box-shadow:0 14px 36px -18px rgba(60,50,40,.28);}
  .name{font-size:17px;font-weight:800;letter-spacing:-.01em;}
  .sub{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);}
  .bar{width:132px;height:3px;border-radius:99px;background:var(--line);overflow:hidden;}
  .bar i{display:block;width:38%;height:100%;border-radius:99px;background:var(--accent);
         animation:slide 1.05s cubic-bezier(.4,0,.2,1) infinite;}
  @keyframes slide{0%{transform:translateX(-115%)}100%{transform:translateX(300%)}}
  .bar.hide{display:none;}
  .fallback{opacity:0;pointer-events:none;transition:opacity .35s;display:flex;flex-direction:column;gap:10px;align-items:center;}
  .fallback.show{opacity:1;pointer-events:auto;}
  .btn{display:inline-block;padding:11px 22px;border-radius:99px;background:var(--ink);color:var(--bg);
       font-size:14px;font-weight:700;text-decoration:none;transition:transform .18s;}
  .btn:active{transform:translateY(1px);}
  .hint{font-size:12px;color:var(--mute);line-height:1.6;max-width:20rem;}
  .guide{max-width:21rem;margin-top:2px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;
         background:#fffaf2;box-shadow:0 14px 36px -20px rgba(60,50,40,.22);text-align:left;}
  .guide h2{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:8px;}
  .guide ol{margin:0;padding-left:1.15rem;}
  .guide li{font-size:12.5px;line-height:1.75;color:var(--ink);}
  .guide b{font-weight:700;}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg);}
  @media(prefers-reduced-motion:reduce){.bar i{animation:none;width:100%;}}
</style>
</head>
<body>

<img class="mark" src="icon-512.png" alt="" width="96" height="96">
<div>
  <div class="name">나의 작은 서재와 극장</div>
  <div class="sub" id="sub" style="margin-top:6px;">Loading</div>
</div>
<div class="bar" id="bar"><i></i></div>

<div class="fallback" id="fb">
  <a class="btn" id="openBtn" href="#">서재 열기</a>
  <p class="hint" id="hint">자동 이동이 차단된 것 같습니다. 위 버튼을 눌러 주세요.</p>
</div>

<div class="guide" id="guide" style="display:none;">
  <h2 id="guideTitle">홈 화면에 추가</h2>
  <ol id="guideSteps"></ol>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  설정 — 여기 두 줄만 관리하면 됩니다
// ══════════════════════════════════════════════════════════════

// ① 이동할 Apps Script 웹앱 주소.
//    GAS를 "새 배포"해서 /exec URL이 바뀌면 이 줄만 교체하세요.
const TARGET = 'https://script.google.com/macros/s/AKfycbx0Bz9qXllX2G7P66oHbWNVHa9fylgsBG0WEMmgrGoEvYH7XSpAlC0MlBTEAP9jQlUB/exec';

// ② 여는 방식
//    'redirect' (기본·권장) : 대시보드로 곧장 이동. 인증 문제 없음.
//                             단, iOS 홈 화면 앱에서는 Safari로 튈 수 있음(외부 도메인 이동이라).
//    'embed'                : 이 페이지 안 iframe으로 띄워 홈 화면 앱 느낌 유지.
//                             구글 인증 쿠키가 차단될 수 있습니다. 안 되면 'redirect'로 되돌리세요.
const MODE = 'embed';

// ══════════════════════════════════════════════════════════════

(function () {
  var btn = document.getElementById('openBtn');
  var fb  = document.getElementById('fb');
  btn.href = TARGET;

  // ── 실행 모드 판별 ────────────────────────────────────────────
  // standalone : 홈 화면 아이콘으로 실행됨 → 곧장 대시보드로
  // 브라우저 탭 : 여기서 멈추고 "홈 화면에 추가" 안내를 보여줌
  //              (?go 를 붙이면 탭에서도 즉시 이동 — 데스크톱 북마크용)
  var standalone = (window.navigator.standalone === true) ||
                   (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var forceGo = /[?&]go\b/.test(location.search);

  if (!standalone && !forceGo) { showAddGuide(); return; }

  function showAddGuide() {
    var ua  = navigator.userAgent;
    var ios = /iPad|iPhone|iPod/.test(ua) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var and = /Android/.test(ua);

    document.getElementById('sub').textContent = 'Launcher';
    document.getElementById('bar').classList.add('hide');
    document.getElementById('hint').textContent =
      '홈 화면에 추가해 두면 이 화면 없이 아이콘에서 바로 열립니다.';
    fb.classList.add('show');

    var steps = ios
      ? ['화면 아래 <b>공유 버튼</b>(↑ 상자 모양)을 누릅니다.',
         '목록을 내려 <b>홈 화면에 추가</b>를 누릅니다.',
         '이름이 <b>서재와 극장</b>으로 뜨는지 확인하고 <b>추가</b>를 누릅니다.']
      : and
      ? ['오른쪽 위 <b>⋮ 메뉴</b>를 누릅니다.',
         '<b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누릅니다.',
         '이름이 <b>서재와 극장</b>으로 뜨는지 확인하고 추가합니다.']
      : ['이 페이지를 <b>북마크</b>해 두면 됩니다.',
         '바로 대시보드로 열고 싶으면 주소 끝에 <b>?go</b>를 붙이세요.'];

    var ol = document.getElementById('guideSteps');
    for (var i = 0; i < steps.length; i++) {
      var li = document.createElement('li');
      li.innerHTML = steps[i];
      ol.appendChild(li);
    }
    if (!ios && !and) document.getElementById('guideTitle').textContent = '이 페이지 사용법';
    document.getElementById('guide').style.display = 'block';
  }

  if (MODE === 'embed') {
    var f = document.createElement('iframe');
    f.src = TARGET;
    f.setAttribute('allow', 'clipboard-read; clipboard-write');
    var ok = false;
    f.onload = function () { ok = true; };
    document.body.appendChild(f);
    // iframe이 막히면(X-Frame-Options 등) 수동 열기 버튼 노출
    setTimeout(function () {
      if (!ok) { f.remove(); fb.classList.add('show'); }
    }, 6000);
    return;
  }

  // redirect — 첫 페인트 직후 즉시 이동
  // ★ [v3] 기존 120ms 인위적 지연 제거. 대시보드 자체 로딩이 길어 이 시간까지 얹을 이유가 없다.
  requestAnimationFrame(function () { location.replace(TARGET); });
  // 이동이 차단된 경우 대비
  setTimeout(function () { fb.classList.add('show'); }, 2800);
})();
</script>
</body>
</html>
